# ============================================================================
# Zero Trust Logstash Pipeline
# ============================================================================
# Inputs: syslog (UDP), Beats (TCP), HTTP-JSON for OPA decisions
# Output: Elasticsearch with date-stamped indices
# ============================================================================

input {
  udp {
    port => 5514
    type => "syslog"
  }
  beats {
    port => 5044
  }
  http {
    port => 8080
    codec => json
    type => "opa-decision"
  }
}

filter {
  if [type] == "opa-decision" {
    mutate { add_field => { "[@metadata][index]" => "zt-opa-decisions" } }
  }
  if [type] == "syslog" {
    mutate { add_field => { "[@metadata][index]" => "zt-syslog" } }
  }
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
